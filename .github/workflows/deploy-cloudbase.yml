name: Deploy to CloudBase

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-cloudbase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@latest

      - name: Build static site (no basePath for CloudBase)
        run: npx next build

      - name: Login to CloudBase
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Deploy to CloudBase Hosting
        env:
          TCB_ENV_ID: history-river-d3g9tykgy8cb196d5
        run: tcb hosting deploy ./out --env-id "$TCB_ENV_ID" --yes
